name: Generate Midjourney Image

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Image prompt (leave empty if using job_id)"
        required: false
        type: string
      job_id:
        description: "Existing Apiframe jobId to fetch instead of generating a new image"
        required: false
        type: string
      aspect_ratio:
        description: "Aspect ratio, e.g. 1:1, 16:9 (ignored when job_id is set)"
        required: false
        default: "1:1"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate image
        env:
          MIDJOURNEY_API_KEY: ${{ secrets.MIDJOURNEY_API_KEY }}
        run: |
          if [ -n "${{ inputs.job_id }}" ]; then
            node scripts/generate-image.js --job-id "${{ inputs.job_id }}"
          else
            node scripts/generate-image.js "${{ inputs.prompt }}" "${{ inputs.aspect_ratio }}"
          fi

      - name: Commit and push generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --cached --quiet; then
            echo "No new image to commit"
          else
            git commit -m "Add generated image: ${{ inputs.job_id || inputs.prompt }}"
            git push
          fi
